<!DOCTYPE html>
<html>
<head>
    <title>ESP32 Booster Clone Provisioning</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: -apple-system, sans-serif; max-width: 400px; margin: 20px auto; padding: 20px; border: 1px solid #ccc; border-radius: 12px; background: #f9f9f9; }
        input, select, button { width: 100%; padding: 12px; margin: 8px 0; box-sizing: border-box; border-radius: 8px; border: 1px solid #ccc; font-size: 16px; }
        button { background: #28a745; color: white; border: none; cursor: pointer; font-weight: bold; }
        .hint { font-size: 0.85em; color: #666; margin-bottom: 12px; line-height: 1.4; }
        h3 { margin-top: 5px; margin-bottom: 5px; }
    </style>
</head>
<body>
    <h2>ESP32 Network Cloner</h2>
    <p class="hint">Type or select your Wi-Fi details below first, then power on your booster to pair and program it instantly.</p>
    
    <!-- Step 1: Input form is visible immediately on page load -->
    <div id="configForm">
        <h3>1. Setup Wi-Fi Credentials</h3>
        
        <label for="historySelect">Quick Select Stored Network:</label>
        <select id="historySelect">
            <option value="">-- Choose Saved Network or Type Below --</option>
        </select>

        <input type="text" id="rSsid" placeholder="Type Target Wi-Fi Name (SSID)">
        <input type="password" id="rPass" placeholder="Type Wi-Fi Password">

        <hr style="border: 0; border-top: 1px solid #ccc; margin: 20px 0;">

        <h3>2. Transmit to Booster</h3>
        <p class="hint">Power on your ESP32 booster, wait 2 seconds, then tap the button below inside Bluefy.</p>
        <button id="connectAndSendBtn">Connect via BLE & Clone Network</button>
    </div>

    <script>
        const SERVICE_UUID = "4fa15560-c33e-11ed-afa1-0242ac120002";
        const ROUTER_CHAR  = "4fa15a42-c33e-11ed-afa1-0242ac120002";
        const BOOSTER_CHAR = "4fa15c72-c33e-11ed-afa1-0242ac120002";

        // Load previously entered networks on page load
        function loadNetworkHistory() {
            const historySelect = document.getElementById('historySelect');
            const saved = JSON.parse(localStorage.getItem('wifi_history') || '[]');
            
            historySelect.innerHTML = '<option value="">-- Choose Saved Network or Type Below --</option>';
            saved.forEach(ssid => {
                let opt = document.createElement('option');
                opt.value = ssid;
                opt.innerHTML = ssid;
                historySelect.appendChild(opt);
            });
        }

        // Handle dropdown selection
        document.getElementById('historySelect').addEventListener('change', (e) => {
            if(e.target.value) {
                document.getElementById('rSsid').value = e.target.value;
            }
        });

        // Initialize history list right away
        loadNetworkHistory();

        // Single action button: Connects and instantly shoots data
        document.getElementById('connectAndSendBtn').addEventListener('click', async () => {
            const targetSSID = document.getElementById('rSsid').value.trim();
            const targetPASS = document.getElementById('rPass').value;

            if(!targetSSID) { alert("Please enter a Wi-Fi network name first."); return; }

            // Save network to iPhone browser cache for next time
            let history = JSON.parse(localStorage.getItem('wifi_history') || '[]');
            if (!history.includes(targetSSID)) {
                history.push(targetSSID);
                localStorage.setItem('wifi_history', JSON.stringify(history));
                loadNetworkHistory(); // Refresh dropdown
            }

            try {
                const originalText = document.getElementById('connectAndSendBtn').innerText;
                document.getElementById('connectAndSendBtn').innerText = "Connecting...";

                // Bluefy opens native iOS pairing popup
                const device = await navigator.bluetooth.requestDevice({
                    filters: [{ name: 'ESP32-Booster-Config' }],
                    optionalServices: [SERVICE_UUID]
                });
                
                const gattServer = await device.gatt.connect();
                const service = await gattServer.getPrimaryService(SERVICE_UUID);
                
                document.getElementById('connectAndSendBtn').innerText = "Sending Data...";

                // Package identical data payloads for cloning
                const networkData = targetSSID + "," + targetPASS;
                const encoder = new TextEncoder();

                // Send network data to characteristic 1
                const rChar = await service.getCharacteristic(ROUTER_CHAR);
                await rChar.writeValue(encoder.encode(networkData));

                // Send identical data to characteristic 2 (enforces cloning)
                const bChar = await service.getCharacteristic(BOOSTER_CHAR);
                await bChar.writeValue(encoder.encode(networkData));

                alert("Success! The ESP32 received the credentials, cloned your network, and started the booster.");
                gattServer.disconnect();
                
                document.getElementById('connectAndSendBtn').innerText = originalText;
            } catch (err) { 
                alert("Error: " + err); 
                document.getElementById('connectAndSendBtn').innerText = "Connect via BLE & Clone Network";
            }
        });
    </script>
</body>
</html>
